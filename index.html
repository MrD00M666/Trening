<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Calendar Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1c1c1e;
            --card-bg: #2c2c2e;
            --text-color: #ffffff;
            --sub-text: #8e8e93;
            --accent-color: #007aff;
            --day-active: #3a3a3c;
            --day-has-note: #30d158;
            --btn-hover: #3a3a3c;
            --input-bg: #1c1c1e;
            --border-color: #3a3a3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 40px;
        }

        .header-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--card-bg);
            padding: 5px 10px;
            border-radius: 12px;
        }

        .header-nav h2 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: capitalize;
            text-align: center;
            min-width: 130px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .year-btn {
            font-size: 1rem;
            font-weight: 600;
            color: var(--sub-text);
            margin-right: 5px;
        }

        .nav-btn:active { background-color: var(--btn-hover); }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 5px;
            text-align: center;
        }
        
        .weekday {
            color: var(--sub-text);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .day {
            background-color: var(--card-bg);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            position: relative;
        }

        .day.empty { background: transparent; cursor: default; }
        .day.today { background-color: #48484a; border: 1px solid #666; }
        .day.has-note { border: 2px solid var(--day-has-note); color: var(--day-has-note); }
        /* Подчеркивание — заловые дни (Пн и Пт) с записью */
        .day.has-note.gym-day::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 7px;
            transform: translateX(-50%);
            width: 14px;
            height: 2px;
            border-radius: 2px;
            background-color: var(--day-has-note);
        }
        .day:active:not(.empty) { transform: scale(0.95); }

        .year-view {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .month-card {
            background-color: var(--card-bg);
            padding: 15px 5px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: capitalize;
        }
        .month-card.current { border: 1px solid var(--accent-color); color: var(--accent-color); }

        #noteModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            backdrop-filter: blur(4px);
            overflow-y: auto;
            padding: 20px 0;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: auto; 
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .modal-header span { color: var(--sub-text); font-size: 0.9rem; }

        /* --- Прошлая тренировка --- */
        #prevWorkoutBtn {
            display: none;
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            background: var(--bg-color);
            border: 1px solid var(--day-has-note);
            color: var(--day-has-note);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
        }
        #prevWorkoutBtn:active { background: var(--btn-hover); }

        #prevWorkoutPanel {
            display: none;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .pw-date {
            color: var(--day-has-note);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .pw-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .pw-row.no-border { border-bottom: none; }

        .pw-ex-name { color: #fff; line-height: 1.3; }
        .pw-ex-weight {
            color: var(--day-has-note);
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .pw-ex-note {
            color: var(--sub-text);
            font-size: 0.8rem;
            padding: 2px 0 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .pw-ex-note.no-border { border-bottom: none; }

        .pw-note {
            color: var(--sub-text);
            font-style: italic;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .pw-old-format {
            color: var(--sub-text);
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .exercise-item {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 10px;
        }

        .exercise-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .ex-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            display: block;
            line-height: 1.3;
            padding-top: 20px;
        }

        .weight-group {
            width: 105px;
            flex-shrink: 0;
        }

        .weight-group label,
        .exercise-note-label,
        .notes-section label {
            display: block;
            margin-bottom: 5px;
            color: var(--sub-text);
            font-size: 0.9rem;
        }

        .weight-group label {
            text-align: center;
            font-size: 0.75rem;
        }

        .prev-val {
            font-size: 0.75rem;
            color: var(--day-has-note);
            text-align: center;
            min-height: 14px;
            margin-bottom: 1px;
            font-weight: 600;
        }

        .ex-input {
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 6px;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        .ex-input:focus,
        textarea:focus { border-color: var(--accent-color); }

        textarea {
            width: 100%;
            height: 80px;
            background: var(--bg-color);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
        }

        .exercise-note {
            margin-bottom: 0;
        }

        #noteInput {
            height: 110px;
        }

        .btn-group { display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--card-bg); padding-top: 10px; }

        button.action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        #saveBtn { background-color: var(--accent-color); color: white; }
        #closeBtn { background-color: #3a3a3c; color: #ff3b30; }

        .loader { 
            text-align: center; 
            color: var(--sub-text); 
            font-size: 0.8rem; 
            height: 20px; 
            margin-bottom: 5px;
        }

        .rest-day-msg {
            text-align: center;
            color: var(--sub-text);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <div class="header-nav">
            <button class="nav-btn year-btn" onclick="toggleViewMode()" id="yearBtn">2024</button>
            <button class="nav-btn" onclick="changeMonth(-1)">&#10094;</button> 
            <h2 id="monthTitle" onclick="toggleViewMode()">...</h2>
            <button class="nav-btn" onclick="changeMonth(1)">&#10095;</button> 
        </div>
    </div>

    <div id="status" class="loader">Загрузка...</div>

    <div id="calendarContainer">
        <div class="weekdays">
            <div class="weekday">Пн</div>
            <div class="weekday">Вт</div>
            <div class="weekday">Ср</div>
            <div class="weekday">Чт</div>
            <div class="weekday">Пт</div>
            <div class="weekday">Сб</div>
            <div class="weekday">Вс</div>
        </div>
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <div id="yearView" class="year-view"></div>

    <div id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalDateTitle">Дата</h3>
                <span id="dayNameTitle">День недели</span>
            </div>

            <button id="prevWorkoutBtn" type="button"></button>
            <div id="prevWorkoutPanel"></div>

            <div id="exercisesContainer" class="exercise-list"></div>

            <div class="notes-section">
                <label>Дополнительные заметки:</label>
                <textarea id="noteInput" placeholder="Самочувствие, комментарии..."></textarea>
            </div>

            <div class="btn-group">
                <button id="closeBtn" class="action-btn">Закрыть</button>
                <button id="saveBtn" class="action-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const DOC_ID = '57319602ea8e41138fb868b026aadc79';
        const API_URL = `https://api.jsoneditoronline.org/v2/docs/${DOC_ID}/data`;

        // Дата перехода на недельное расписание.
        // Дни ДО этой даты живут по старому 4-дневному циклу (A/отдых/B/отдых),
        // чтобы старые записи в календаре и модалке отображались корректно.
        const WEEKLY_SCHEDULE_START = '2026-07-27'; // понедельник этой недели — скорректируй при необходимости

        // --- Новое недельное расписание ---
        // Индекс = getDay(): 0 = Вс, 1 = Пн ... 6 = Сб
        const WEEKLY_SCHEDULE = [
            { label: "Отдых",            gym: false, exercises: [] },                                                        // Вс
            { label: "Зал",              gym: true,  exercises: ["Горизонтальная тяга", "Жим ногами", "Бабочка"] },          // Пн
            { label: "Дом",              gym: false, exercises: ["Шея", "Махи"] },                                           // Вт
            { label: "Дом",              gym: false, exercises: ["Подтягивания"] },                                          // Ср
            { label: "Дом",              gym: false, exercises: ["Предплечья", "Шея", "Отжимания"] },                        // Чт
            { label: "Зал",              gym: true,  exercises: ["Задняя дельта", "Бицепс бедра", "Шраги", "Бабочка"] },     // Пт
            { label: "Дом",              gym: false, exercises: ["Бицепс", "Французский жим", "Махи"] }                      // Сб
        ];

        // Соответствие новых названий старым — чтобы зеленые "прошлые веса"
        // подтягивались из записей, сделанных при старом расписании.
        // Правь свободно: ключ — новое имя, значение — массив старых имен.
        const EXERCISE_ALIASES = {
            "Горизонтальная тяга": ["Тяга рычажная (спина)"],
            "Бабочка":             [],                          // в старом плане "Бабочка (зад. дельта)" — это задняя дельта, НЕ грудная бабочка
            "Задняя дельта":       ["Бабочка (зад. дельта)"],
            "Махи":                ["Махи (ср. дельта)"],
            "Отжимания":           ["Отжимания (ноги выше)"],
            "Шраги":               ["Шраги (трапеции)"],
            "Шея":                 [],                          // старые "Шея вперед/назад/боковые" — три разных упражнения, автоматически не сводятся
            "Предплечья":          []                           // аналогично: "Предплечья верх/вниз"
        };

        // --- Старое расписание (для дат до WEEKLY_SCHEDULE_START) ---
        const CYCLE_START_DATE = new Date(2025, 2, 17); // 17.03.2025, локальное время
        const WORKOUT_CYCLES = [
            [
                "Подтягивания", "Отжимания (ноги выше)", "Шея вперед", "Шея назад",
                "Шея боковые", "Предплечья верх", "Предплечья вниз", "Гиперэкстензия", "Шраги (трапеции)"
            ],
            [],
            [
                "Жим ногами", "Тяга рычажная (спина)", "Жим вверх плечи",
                "Махи (ср. дельта)", "Бабочка (зад. дельта)", "Французский жим", "Бицепс"
            ],
            []
        ];
        const CYCLE_LABELS = ["Тренировка A", "Отдых", "Тренировка B", "Отдых"];

        const WEEKDAY_NAMES = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        // --- Вспомогательные функции дат ---

        // Ключ 'YYYY-MM-DD' → локальная дата. new Date('YYYY-MM-DD') дал бы
        // UTC-полночь и мог бы сдвинуть день недели при смещении пояса.
        function parseDateKey(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function toDateKey(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        function formatDateKey(key) {
            const [y, m, d] = key.split('-');
            return `${d}.${m}.${y}`;
        }

        function isWeeklySchedule(dateKey) {
            return dateKey >= WEEKLY_SCHEDULE_START;
        }

        // --- Логика старого цикла (только для старых дат) ---

        function getCycleIndex(dateObj) {
            const start = new Date(CYCLE_START_DATE);
            start.setHours(0, 0, 0, 0);
            const d = new Date(dateObj);
            d.setHours(0, 0, 0, 0);
            const diffDays = Math.round((d - start) / (1000 * 60 * 60 * 24));
            return ((diffDays % 4) + 4) % 4;
        }

        // --- Единая точка: план и подпись для любой даты ---

        function getPlanForKey(dateKey) {
            const dateObj = parseDateKey(dateKey);
            if (isWeeklySchedule(dateKey)) {
                const day = WEEKLY_SCHEDULE[dateObj.getDay()];
                return {
                    exercises: day.exercises,
                    label: `${WEEKDAY_NAMES[dateObj.getDay()]} · ${day.label}`,
                    gym: day.gym,
                    weekly: true
                };
            } else {
                const idx = getCycleIndex(dateObj);
                return {
                    exercises: WORKOUT_CYCLES[idx],
                    label: CYCLE_LABELS[idx],
                    gym: idx === 2,
                    weekly: false
                };
            }
        }

        const tg = window.Telegram.WebApp;
        tg.expand(); 

        let workoutData = {};
        let displayedDate = new Date(); 
        let selectedDateKey = null;        
        let isYearView = false;

        const calendarEl = document.getElementById('calendar');
        const yearViewEl = document.getElementById('yearView');
        const calendarContainer = document.getElementById('calendarContainer');
        const modal = document.getElementById('noteModal');
        const noteInput = document.getElementById('noteInput');
        const exercisesContainer = document.getElementById('exercisesContainer');
        const statusEl = document.getElementById('status');
        const monthTitle = document.getElementById('monthTitle');
        const yearBtn = document.getElementById('yearBtn');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const dayNameTitle = document.getElementById('dayNameTitle');
        const prevWorkoutBtn = document.getElementById('prevWorkoutBtn');
        const prevWorkoutPanel = document.getElementById('prevWorkoutPanel');

        // --- 1. Работа с данными ---

        async function loadData() {
            statusEl.innerText = "Обновление...";
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const data = await response.json();
                    workoutData = data || {};
                    statusEl.innerText = "";
                } else {
                    workoutData = {};
                    statusEl.innerText = "";
                }
            } catch (error) {
                console.error(error);
                statusEl.innerText = "Офлайн режим";
            }
        }

        async function saveData() {
            statusEl.innerText = "Сохранение...";
            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(workoutData)
                });
                if (response.ok) {
                    statusEl.innerText = "Сохранено ✅";
                    setTimeout(() => statusEl.innerText = "", 2000);
                } else {
                    statusEl.innerText = "Ошибка сервера ❌";
                }
            } catch (error) {
                statusEl.innerText = "Ошибка сети ❌";
            }
        }

        // --- 2. Логика календаря ---

        function changeMonth(offset) {
            if (isYearView) {
                displayedDate.setFullYear(displayedDate.getFullYear() + offset);
            } else {
                displayedDate.setMonth(displayedDate.getMonth() + offset);
            }
            render();
        }

        function toggleViewMode() {
            isYearView = !isYearView;
            render();
        }

        function selectMonth(monthIndex) {
            displayedDate.setMonth(monthIndex);
            isYearView = false;
            render();
        }

        function render() {
            const year = displayedDate.getFullYear();
            yearBtn.innerText = year;

            if (isYearView) {
                calendarContainer.style.display = 'none';
                yearViewEl.style.display = 'grid';
                monthTitle.innerText = "Выберите месяц";
                renderYearView();
            } else {
                calendarContainer.style.display = 'block';
                yearViewEl.style.display = 'none';
                
                const monthName = displayedDate.toLocaleString('ru-RU', { month: 'long' });
                monthTitle.innerText = monthName.charAt(0).toUpperCase() + monthName.slice(1);
                renderCalendar();
            }
        }

        function renderYearView() {
            yearViewEl.innerHTML = '';
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            const displayYear = displayedDate.getFullYear();

            for (let i = 0; i < 12; i++) {
                const monthDiv = document.createElement('div');
                monthDiv.className = 'month-card';
                const name = new Date(displayYear, i).toLocaleString('ru-RU', { month: 'long' });
                monthDiv.innerText = name;

                if (i === currentMonth && displayYear === currentYear) {
                    monthDiv.classList.add('current');
                }

                monthDiv.onclick = () => selectMonth(i);
                yearViewEl.appendChild(monthDiv);
            }
        }

        function renderCalendar() {
            calendarEl.innerHTML = '';
            const year = displayedDate.getFullYear();
            const month = displayedDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

            const today = new Date();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyEl = document.createElement('div');
                emptyEl.className = 'day empty';
                calendarEl.appendChild(emptyEl);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'day';
                dayEl.innerText = i;
                
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                if (workoutData[dateKey]) {
                    dayEl.classList.add('has-note');
                    if (getPlanForKey(dateKey).gym) {
                        dayEl.classList.add('gym-day');
                    }
                }

                if (year === today.getFullYear() && month === today.getMonth() && i === today.getDate()) {
                    dayEl.classList.add('today');
                }

                dayEl.onclick = () => openModal(dateKey, i, month, year);
                calendarEl.appendChild(dayEl);
            }
        }

        // --- 3. Прошлая тренировка ---

        function getExNote(ex) {
            return ex.note || ex.exerciseNote || '';
        }

        // Набор имен, под которыми упражнение могло быть записано раньше
        function getNameVariants(exName) {
            return [exName, ...(EXERCISE_ALIASES[exName] || [])];
        }

        function findExerciseInEntry(entry, exName) {
            if (!entry || typeof entry !== 'object' || !Array.isArray(entry.exercises)) return null;
            const variants = getNameVariants(exName);
            return entry.exercises.find(e => variants.includes(e.name)) || null;
        }

        // Последняя тренировка того же типа ДО указанной даты.
        // Для недельного расписания "тот же тип" = тот же день недели.
        // Подводные камни:
        //  1) Первое время предыдущего "такого же" дня по новому расписанию
        //     еще нет — тогда fallback: последний день, чьи упражнения
        //     пересекаются с текущим планом (с учетом алиасов старых имен).
        //  2) Записи старого формата: строка вместо объекта, exerciseNote
        //     вместо note, отсутствие exercises — все обрабатывается.
        function getLastSameWorkout(currentDateKey) {
            const plan = getPlanForKey(currentDateKey);
            if (!plan.exercises || plan.exercises.length === 0) return null; // день отдыха

            const pastDates = Object.keys(workoutData)
                .filter(d => d < currentDateKey)
                .sort();

            const targetWeekday = parseDateKey(currentDateKey).getDay();

            // 1-й проход: тот же день недели (только среди дат нового расписания)
            for (let i = pastDates.length - 1; i >= 0; i--) {
                const dKey = pastDates[i];
                if (!isWeeklySchedule(dKey)) break; // дальше только старый цикл
                if (parseDateKey(dKey).getDay() === targetWeekday && workoutData[dKey]) {
                    return { dateKey: dKey, data: workoutData[dKey] };
                }
            }

            // 2-й проход (fallback): последний день с пересечением по упражнениям
            const variantSet = new Set(plan.exercises.flatMap(getNameVariants));
            for (let i = pastDates.length - 1; i >= 0; i--) {
                const dKey = pastDates[i];
                const entry = workoutData[dKey];
                if (entry && typeof entry === 'object' && Array.isArray(entry.exercises) &&
                    entry.exercises.some(e => variantSet.has(e.name))) {
                    return { dateKey: dKey, data: entry };
                }
            }

            return null;
        }

        function buildPrevWorkoutHTML(pw) {
            let html = `<div class="pw-date">${formatDateKey(pw.dateKey)} — ${escapeHTML(getPlanForKey(pw.dateKey).label)}</div>`;
            const data = pw.data;

            // Совсем старый формат: запись — просто строка-заметка
            if (typeof data === 'string') {
                html += `<div class="pw-note">${escapeHTML(data)}</div>`;
                html += `<div class="pw-old-format">Старый формат записи — есть только заметка</div>`;
                return html;
            }

            const exercises = Array.isArray(data.exercises) ? data.exercises : [];

            if (exercises.length === 0) {
                html += `<div class="pw-old-format">Веса в этот день не записаны</div>`;
            }

            exercises.forEach((ex, idx) => {
                const isLast = idx === exercises.length - 1;
                const note = getExNote(ex);
                const weightStr = ex.weight ? `${escapeHTML(ex.weight)} кг` : '—';
                html += `<div class="pw-row${(isLast && !note) || note ? ' no-border' : ''}">
                            <span class="pw-ex-name">${escapeHTML(ex.name)}</span>
                            <span class="pw-ex-weight">${weightStr}</span>
                         </div>`;
                if (note) {
                    html += `<div class="pw-ex-note${isLast ? ' no-border' : ''}">${escapeHTML(note)}</div>`;
                }
            });

            if (data.note) {
                html += `<div class="pw-note">${escapeHTML(data.note)}</div>`;
            }

            return html;
        }

        function setupPrevWorkoutUI(dateKey) {
            prevWorkoutPanel.style.display = 'none';
            prevWorkoutPanel.innerHTML = '';

            const pw = getLastSameWorkout(dateKey);

            if (!pw) {
                prevWorkoutBtn.style.display = 'none';
                prevWorkoutBtn.onclick = null;
                return;
            }

            const dateLabel = formatDateKey(pw.dateKey);
            prevWorkoutBtn.style.display = 'block';
            prevWorkoutBtn.innerText = `Прошлая тренировка (${dateLabel}) ▾`;

            prevWorkoutBtn.onclick = () => {
                const isOpen = prevWorkoutPanel.style.display === 'block';
                if (isOpen) {
                    prevWorkoutPanel.style.display = 'none';
                    prevWorkoutBtn.innerText = `Прошлая тренировка (${dateLabel}) ▾`;
                } else {
                    if (!prevWorkoutPanel.innerHTML) {
                        prevWorkoutPanel.innerHTML = buildPrevWorkoutHTML(pw);
                    }
                    prevWorkoutPanel.style.display = 'block';
                    prevWorkoutBtn.innerText = `Скрыть прошлую тренировку ▴`;
                }
            };
        }

        // --- 4. Модальное окно ---

        // Последняя запись данного упражнения (с учетом старых названий)
        function getLastLog(currentDateKey, exName) {
            const pastDates = Object.keys(workoutData)
                .filter(d => d < currentDateKey)
                .sort();

            for (let i = pastDates.length - 1; i >= 0; i--) {
                const ex = findExerciseInEntry(workoutData[pastDates[i]], exName);
                if (ex) return ex;
            }
            return null;
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function openModal(dateKey, dayNum, month, year) {
            selectedDateKey = dateKey;

            const plan = getPlanForKey(dateKey);

            modalDateTitle.innerText = `${dayNum}.${String(month + 1).padStart(2, '0')}.${year}`;
            dayNameTitle.innerText = plan.label;

            // Кнопка "Прошлая тренировка" (всегда сброшена в закрытое состояние)
            setupPrevWorkoutUI(dateKey);

            let savedData = workoutData[dateKey];
            let savedExercises = [];
            let savedNote = "";

            if (typeof savedData === 'string') {
                savedNote = savedData;
            } else if (savedData && typeof savedData === 'object') {
                savedExercises = savedData.exercises || [];
                savedNote = savedData.note || "";
            }

            noteInput.value = savedNote;
            exercisesContainer.innerHTML = ''; 

            // Если в этот день уже есть сохраненные упражнения, которых нет
            // в текущем плане (записаны при старом расписании) — показываем
            // и их тоже, чтобы данные не "исчезли" из интерфейса.
            let planExercises = (plan.exercises || []).slice();
            const planVariantSet = new Set(planExercises.flatMap(getNameVariants));
            savedExercises.forEach(e => {
                if (!planVariantSet.has(e.name) && !planExercises.includes(e.name)) {
                    planExercises.push(e.name);
                }
            });

            if (planExercises.length > 0) {
                planExercises.forEach(exName => {
                    const savedEx = findExerciseInEntry({ exercises: savedExercises }, exName) || {};
                    const prevEx = getLastLog(dateKey, exName) || {};
                    
                    const exItem = document.createElement('div');
                    exItem.className = 'exercise-item';
                    exItem.dataset.name = exName;

                    const exerciseNote = savedEx.note || savedEx.exerciseNote || '';
                    const inputsHTML = `
                        <div class="exercise-top">
                            <span class="ex-name">${escapeHTML(exName)}</span>
                            <div class="weight-group">
                                <div class="prev-val">${escapeHTML(prevEx.weight || '')}</div>
                                <label>Вес (кг)</label>
                                <input type="number" class="ex-input inp-weight" placeholder="0" value="${escapeHTML(savedEx.weight || '')}">
                            </div>
                        </div>
                        <label class="exercise-note-label">Заметки:</label>
                        <textarea class="exercise-note inp-ex-note" placeholder="Техника, ощущения, комментарии...">${escapeHTML(exerciseNote)}</textarea>
                    `;
                    
                    exItem.innerHTML = inputsHTML;
                    exercisesContainer.appendChild(exItem);
                });
            } else {
                exercisesContainer.innerHTML = '<div class="rest-day-msg">День отдыха!</div>';
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            noteInput.blur();
        }

        document.getElementById('closeBtn').onclick = closeModal;

        document.getElementById('saveBtn').onclick = async () => {
            const noteText = noteInput.value.trim();
            const exerciseItems = document.querySelectorAll('.exercise-item');
            
            let exercisesToSave = [];

            exerciseItems.forEach(item => {
                const name = item.dataset.name;
                const inpWeight = item.querySelector('.inp-weight');
                const inpExNote = item.querySelector('.inp-ex-note');

                let entry = { name };
                let hasData = false;
                const weight = inpWeight ? inpWeight.value.trim() : '';
                const exerciseNote = inpExNote ? inpExNote.value.trim() : '';

                if (weight) entry.weight = weight;
                if (exerciseNote) entry.note = exerciseNote;
                if (entry.weight || entry.note) hasData = true;

                if (hasData) exercisesToSave.push(entry);
            });

            const entry = {
                exercises: exercisesToSave,
                note: noteText
            };

            if (exercisesToSave.length > 0 || noteText) {
                workoutData[selectedDateKey] = entry;
            } else {
                delete workoutData[selectedDateKey];
            }

            closeModal();
            render();
            await saveData();
        };

        window.onclick = function(event) {
            if (event.target == modal) closeModal();
        }

        async function init() {
            render(); 
            await loadData(); 
            render(); 
        }

        init();
    </script>
</body>
</html>
